<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universo de Bianka 💫</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: radial-gradient(ellipse at 20% 20%, #1a0b3a 0%, #0d0530 55%, #05021c 100%);
    cursor: crosshair;
    user-select: none;
  }

  canvas#sky {
    position: fixed;
    inset: 0;
    display: block;
  }

  .glow-cursor {
    position: fixed;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 214, 120, .18), rgba(255, 153, 214, .08) 40%, transparent 70%);
    mix-blend-mode: screen;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 1;
  }

  .ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .title {
    position: fixed;
    top: 34px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 4;
    pointer-events: none;
  }

  .title h1 {
    font-size: clamp(26px, 5vw, 44px);
    letter-spacing: 6px;
    color: #ffe9a8;
    text-shadow: 0 0 18px rgba(255, 214, 120, .9), 0 0 60px rgba(255, 170, 90, .6), 0 2px 0 rgba(120, 60, 0, .5);
    animation: floatT 5s ease-in-out infinite;
  }

  .title p {
    margin-top: 8px;
    font-size: 15px;
    font-style: italic;
    color: #cbb6ff;
    letter-spacing: 3px;
    text-shadow: 0 0 12px rgba(190, 150, 255, .7);
  }

  @keyframes floatT {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .hint {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    font-style: italic;
    color: rgba(235, 220, 255, .8);
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(255, 214, 120, .5);
    animation: hintGlow 3s ease-in-out infinite;
    z-index: 4;
    pointer-events: none;
    transition: opacity .8s ease;
  }

  .reveal {
    position: fixed;
    bottom: 66px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    padding: 12px 26px;
    font-family: Georgia, serif;
    font-size: 16px;
    font-style: italic;
    letter-spacing: 2px;
    color: #ffe9a8;
    border: 1px solid rgba(255, 212, 120, .65);
    border-radius: 40px;
    background: rgba(20, 10, 50, .55);
    cursor: pointer;
    animation: hintGlow 3s ease-in-out infinite;
    transition: background .25s, box-shadow .25s, transform .25s;
  }

  .reveal:hover {
    background: rgba(255, 210, 120, .22);
    box-shadow: 0 0 30px rgba(255, 210, 120, .55);
    transform: translateX(-50%) scale(1.04);
  }

  .toast {
    position: fixed;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%) scale(.8);
    z-index: 12;
    padding: 18px 30px;
    font-size: 20px;
    font-style: italic;
    color: #fff3d0;
    text-align: center;
    letter-spacing: 2px;
    background: rgba(20, 10, 50, .75);
    border: 1px solid rgba(255, 212, 120, .7);
    border-radius: 18px;
    box-shadow: 0 0 40px rgba(255, 200, 100, .5);
    opacity: 0;
    pointer-events: none;
    transition: opacity .8s ease, transform .8s cubic-bezier(.2, 1.4, .4, 1);
  }

  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  @keyframes hintGlow {
    0%, 100% { opacity: .55; }
    50% { opacity: 1; }
  }

  .msg-wrap {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(5, 2, 20, .45);
    backdrop-filter: blur(3px);
    animation: fadeIn .4s ease;
  }

  .msg-wrap.show { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .msg-card {
    position: relative;
    max-width: 620px;
    width: 86%;
    padding: 44px 40px 40px;
    text-align: center;
    border-radius: 30px;
    background: linear-gradient(160deg, rgba(30, 20, 70, .95), rgba(12, 6, 40, .97));
    border: 1px solid rgba(255, 212, 120, .65);
    box-shadow: 0 0 40px rgba(255, 200, 100, .35), inset 0 0 30px rgba(120, 80, 255, .18);
    animation: pop .45s cubic-bezier(.2, 1.5, .4, 1);
  }

  @keyframes pop {
    0% { transform: scale(.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .msg-card .star-icon {
    font-size: 40px;
    display: inline-block;
    animation: twink 1.6s ease-in-out infinite;
    text-shadow: 0 0 22px rgba(255, 230, 150, 1);
  }

  @keyframes twink {
    0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
    50% { transform: scale(1.25) rotate(8deg); opacity: .8; }
  }

  .msg-card h2 {
    margin-top: 10px;
    font-size: 20px;
    letter-spacing: 3px;
    color: #ffe9a8;
    text-transform: uppercase;
  }

  .msg-card .msg {
    margin-top: 18px;
    font-size: 22px;
    line-height: 1.7;
    font-style: italic;
    color: #f5ecff;
    text-shadow: 0 0 14px rgba(190, 150, 255, .45);
  }

  .msg-card .close {
    position: absolute;
    top: 14px;
    right: 18px;
    font-size: 26px;
    color: rgba(255, 235, 180, .7);
    cursor: pointer;
    background: none;
    border: none;
    line-height: 1;
    transition: transform .2s, color .2s;
  }

  .msg-card .close:hover { transform: scale(1.25); color: #fff; }

  .msg-card .close2 {
    margin-top: 26px;
    padding: 10px 24px;
    font-family: Georgia, serif;
    font-size: 15px;
    font-style: italic;
    letter-spacing: 1px;
    color: #ffe9a8;
    border: 1px solid rgba(255, 212, 120, .6);
    border-radius: 30px;
    background: rgba(255, 210, 120, .08);
    cursor: pointer;
    transition: background .25s, box-shadow .25s;
  }

  .msg-card .close2:hover {
    background: rgba(255, 210, 120, .2);
    box-shadow: 0 0 24px rgba(255, 210, 120, .5);
  }

  .sparkle {
    position: fixed;
    z-index: 8;
    pointer-events: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff, #ffd876 60%, transparent);
    animation: sparkleOut 0.8s ease-out forwards;
    text-shadow: none;
  }

  .sparkle::after {
    content: '✦';
    position: absolute;
    inset: -6px;
    color: #ffe9a8;
    font-size: 16px;
  }

  @keyframes sparkleOut {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(.2) translateY(-30px); opacity: 0; }
  }
</style>
</head>
<body>

<!-- Cursor brillante -->
<div class="glow-cursor" id="glow"></div>

<canvas id="sky"></canvas>

<div class="title">
  <h1>✨ UNIVERSO DE BIANKA ✨</h1>
  <p>cada estrella guarda un mensaje solo para ti</p>
</div>

<div class="hint" id="subtitleLine" style="opacity:0">
  ✨ Celébralo, mira: ¡ella ya es una constelación! ✨
</div>

<button class="reveal" id="revBtn">✦ Toca aquí: la constelación de Bianka ✦</button>

<div class="toast" id="toast"></div>

<!-- Tarjeta de mensaje -->
<div class="msg-wrap" id="msgWrap">
  <div class="msg-card">
    <button class="close" id="closeX" aria-label="Cerrar">✕</button>
    <span class="star-icon" id="starIcon">💛</span>
    <h2 id="starName">Estrella</h2>
    <p class="msg" id="starMsg"></p>
    <button class="close2" id="closeBtn">cerrar y seguir mirando ✨</button>
  </div>
</div>

<script>
(function () {
  // ---------- INTERFAZ ----------
  var glow = document.getElementById('glow');
  var msgWrap = document.getElementById('msgWrap');
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');

  window.addEventListener('pointermove', function (e) {
    glow.style.left = e.clientX + 'px';
    glow.style.top = e.clientY + 'px';
  });

  function sparkle(x, y) {
    var s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    document.body.appendChild(s);
    setTimeout(function () { s.remove(); }, 800);
  }

  // ---------- MENSAJES ----------
  var stars = [
    { nom: 'Estrella Dorada', ico: '💛', msg: 'Cada estrella que ves en el cielo brilla por ti, mi princesa.' },
    { nom: 'Lucero',          ico: '⭐', msg: 'En el infinito universo, la única que miro eres tú.' },
    { nom: 'Estrella Rosa',   ico: '🌸', msg: 'Tu sonrisa ilumina más que todas las estrellas juntas.' },
    { nom: 'Luna de Miel',    ico: '🌙', msg: 'Te quiero más que a todos los astros del firmamento.' },
    { nom: 'Sol de Medianoche', ico: '☀️', msg: 'El sol brilla de día, pero por ti brillo yo cada noche.' },
    { nom: 'Perla del Cielo', ico: '🔆', msg: 'Eres la estrella más brillante que existe en mi corazón.' },
    { nom: 'Diamante Azul',   ico: '💎', msg: 'Cada vez que cierro los ojos, tu rostro se ilumina así de fuerte.' },
    { nom: 'Cometa de Sueños', ico: '🌠', msg: 'Si el universo es infinito, infinito es lo que te amo.' },
    { nom: 'Corazón de Fuego',ico: '❤️', msg: 'Contigo descubrí que tengo un universo completo dentro del pecho.' },
    { nom: 'Constelación Favorita', ico: '✨', msg: 'Eres mi constelación favorita, la única que quiero contemplar.' },
    { nom: 'Princesa Celeste', ico: '👸', msg: 'El cielo es hermoso, pero nunca podrá igualar tu belleza.' },
    { nom: 'Estrella Eterna', ico: '💫', msg: 'Te dibujé esta galaxia entera, solo para ti, Bianka.' }
  ];

  // Constelación de Bianka (silueta extraída de su retrato)
  var CONSTELLATION = [
    [0.091,0.000],[0.182,0.022],[0.182,0.067],[0.273,0.044],[0.455,0.067],
    [0.667,0.067],[0.848,0.067],[0.848,0.156],[0.818,0.244],[0.970,0.289],
    [1.000,0.356],[0.939,0.422],[0.909,0.556],[0.909,0.689],[0.879,0.867],
    [0.848,1.000],[0.667,1.000],[0.485,1.000],[0.303,1.000],[0.152,1.000],
    [0.030,1.000],[0.030,0.822],[0.030,0.667],[0.061,0.511],[0.152,0.378],
    [0.242,0.311],[0.212,0.222],[0.121,0.133],[0.030,0.089],[0.000,0.022]
  ];

  var constState = { active: false, start: 0 };

  function constLayout() {
    var scale = Math.min(W * 0.46, H * 0.62);
    var cx = W * 0.5, cy = H * 0.5;
    return CONSTELLATION.map(function (p) {
      return { x: cx + (p[0] - 0.5) * scale, y: cy + (p[1] - 0.5) * scale };
    });
  }

  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(function () { el.classList.remove('show'); }, 4200);
  }

  function drawConstellation(time, cx0, cy0, radius) {
    var pts = constLayout();
    var N = pts.length;
    var p = Math.min(1, (time - constState.start) / 4.2);
    var lit = Math.ceil(N * (1 - Math.pow(1 - p, 3)));

    if (!constState.hx) {
      var sx = 0, sy = 0;
      for (var q = 0; q < N; q++) { sx += pts[q].x; sy += pts[q].y; }
      constState.hx = sx / N; constState.hy = sy / N;
    }
    var R = Math.min(W, H) * 0.42;
    var halo = ctx.createRadialGradient(constState.hx, constState.hy, 0, constState.hx, constState.hy, R);
    halo.addColorStop(0, 'rgba(255,214,120,0.10)');
    halo.addColorStop(0.6, 'rgba(255,140,214,0.05)');
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, W, H);

    if (lit > 0) {
      ctx.lineWidth = 1.4;
      for (var i = 0; i < lit; i++) {
        var a = pts[i], b = pts[(i + 1) % N];
        var f = (i / lit) * 0.30 + 0.10;
        ctx.strokeStyle = 'rgba(255,224,140,' + f.toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
      for (var s = 0; s < lit; s++) {
        var st = pts[s];
        var tw = 0.7 + 0.3 * Math.sin(time * 2.2 + s);
        var r = 2.6 + ((s * 7) % 5) * 0.8;
        var spr = sprites[(s % 2 === 0) ? '#ffd876' : '#ffffff'];
        ctx.globalAlpha = tw * 0.85;
        ctx.drawImage(spr, st.x - r * 3, st.y - r * 3, r * 6, r * 6);
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.beginPath();
        ctx.arc(st.x, st.y, r * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function showConstellation() {
    if (constState.active) return;
    constState.active = true;
    constState.start = performance.now() / 1000;
    var btn = document.getElementById('revBtn');
    if (btn) btn.style.display = 'none';
    document.getElementById('subtitleLine').style.display = 'block';
    setTimeout(function () { toast('Tu princesa brilla entre las estrellas 💛'); }, 4300);
  }

  function rnd(a, b) { return a + Math.random() * (b - a); }

  // ---------- DIBUJO ----------
  var W = 0, H = 0;
  var bgStars = [];          // estrellas de fondo
  var specials = [];         // estrellas con mensaje
  var nebulae = [];
  var meteors = [];
  var sprites = {};          // sprites de resplandor
  var nextMeteor = 3;

  function buildSprites() {
    ['#ffd876', '#ff8fd0', '#8fd6ff', '#d9a0ff', '#ffffff'].forEach(function (color, i) {
      var s = document.createElement('canvas');
      var size = 64;
      s.width = s.height = size;
      var g = s.getContext('2d');
      var grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.12, color);
      grad.addColorStop(0.35, hexA(color, 0.5));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, size, size);
      sprites[color] = s;
    });
  }

  function hexA(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  function buildSky() {
    bgStars = [];
    nebulae = [];
    specials = [];
    for (var i = 0; i < 220; i++) {
      bgStars.push({
        x: rnd(0, W), y: rnd(0, H),
        r: rnd(.5, 2.1),
        a: rnd(.25, .9),
        sp: rnd(.6, 2.4),
        ph: rnd(0, Math.PI * 2),
        color: Math.random() < .88 ? '#ffffff' : (Math.random() < .5 ? '#ffd876' : '#8fd6ff')
      });
    }
    var cols = ['#b14dff', '#ff6fd0', '#59a5ff', '#ffb45a', '#c463ff'];
    for (var n = 0; n < 6; n++) {
      var ncol = cols[n % cols.length];
      var x = rnd(-W * .15, W * 1.15), y = rnd(0, H * .85);
      var r = rnd(W * .25, W * .55);
      var c = document.createElement('canvas');
      c.width = c.height = 256;
      var g = c.getContext('2d');
      var gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
      gr.addColorStop(0, hexA(ncol, .5));
      gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr;
      g.fillRect(0, 0, 256, 256);
      nebulae.push({ x: x, y: y, r: r, img: c, driftX: rnd(-14, 14), driftY: rnd(-8, 8), ph: rnd(0, 6) });
    }
    var colors = ['#ffd876', '#ff8fd0', '#8fd6ff', '#d9a0ff'];
    var used = [];
    function place() {
      var tries = 0;
      while (tries++ < 80) {
        var cx = rnd(W * .05, W * .95), cy = rnd(H * .12, H * .85);
        var ok = true;
        for (var j = 0; j < used.length; j++) {
          var u = used[j];
          if (Math.hypot(cx - u.x, cy - u.y) < 110) { ok = false; break; }
        }
        if (ok) { used.push({ x: cx, y: cy }); return { x: cx, y: cy }; }
      }
      return { x: rnd(W * .1, W * .9), y: rnd(H * .15, H * .8) };
    }
    for (var m = 0; m < 12; m++) {
      var pos = place();
      specials.push({
        x: pos.x, y: pos.y,
        r: rnd(5, 8),
        color: colors[m % colors.length],
        sp: rnd(1.2, 2.6),
        ph: rnd(0, Math.PI * 2),
        data: stars[m]
      });
    }
  }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildSky();
    buildSprites();
  }

  // ---------- METEOROS ----------
  function launchMeteor() {
    var fromLeft = Math.random() < .6;
    var sx = fromLeft ? rnd(-50, W * .5) : rnd(W * .5, W + 50);
    var sy = rnd(-40, H * .3);
    var vx = rnd(6, 10) * (fromLeft ? 1 : -1);
    meteors.push({ x: sx, y: sy, vx: vx, vy: rnd(3, 6) });
  }

  function draw(t) {
    var time = t / 1000;
    ctx.clearRect(0, 0, W, H);

    // nebulosas
    for (var i = 0; i < nebulae.length; i++) {
      var nb = nebulae[i];
      var nx = nb.x + Math.sin(time * 0.05 + nb.ph) * nb.driftX;
      var ny = nb.y + Math.cos(time * 0.04 + nb.ph) * nb.driftY;
      ctx.globalAlpha = 0.9;
      ctx.drawImage(nb.img, nx - nb.r, ny - nb.r, nb.r * 2, nb.r * 2);
    }

    // estrellas de fondo
    for (var s = 0; s < bgStars.length; s++) {
      var st = bgStars[s];
      var alpha = st.a * (0.5 + 0.5 * Math.sin(time * st.sp + st.ph));
      ctx.globalAlpha = Math.max(alpha, 0.05);
      ctx.fillStyle = st.color;
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // estrellas especiales con resplandor
    for (var g = 0; g < specials.length; g++) {
      var sp = specials[g];
      var pulse = 0.5 + 0.5 * Math.sin(time * sp.sp + sp.ph);
      var scale = sp.r * (2.4 + pulse * 1.7);
      var sprite = sprites[sp.color];
      ctx.globalAlpha = 0.75 + pulse * 0.25;
      ctx.drawImage(sprite, sp.x - scale, sp.y - scale, scale * 2, scale * 2);
      // núcleo
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, sp.r * (0.55 + pulse * 0.25), 0, Math.PI * 2);
      ctx.fill();
      // anillo
      ctx.strokeStyle = hexA(sp.color, 0.5 + pulse * 0.35);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, sp.r * (1.6 + pulse * 0.8), 0, Math.PI * 2);
      ctx.stroke();
    }

    // meteoros
    if (time > nextMeteor) {
      nextMeteor = time + rnd(4, 11);
      launchMeteor();
    }
    for (var mn = meteors.length - 1; mn >= 0; mn--) {
      var m = meteors[mn];
      m.x += m.vx; m.y += m.vy;
      // estela
      ctx.strokeStyle = 'rgba(255,255,255,.85)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x - m.vx * 9, m.y - m.vy * 9);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,220,140,.4)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x - m.vx * 5, m.y - m.vy * 5);
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(m.x, m.y, 1.8, 0, Math.PI * 2);
      ctx.fill();
      if (m.x < -100 || m.x > W + 100 || m.y > H + 100) meteors.splice(mn, 1);
    }

    if (constState.active) drawConstellation(time, W / 2, H / 2, Math.min(W, H) * 0.42);
  }

  // ---------- INTERACCIÓN ----------
  function nearestSpecial(x, y) {
    var best = null, bestD = 30;
    for (var i = 0; i < specials.length; i++) {
      var d = Math.hypot(specials[i].x - x, specials[i].y - y);
      if (d < bestD) { bestD = d; best = specials[i]; }
    }
    return best;
  }

  function showMessage(star) {
    document.getElementById('starIcon').textContent = star.data.ico;
    document.getElementById('starName').textContent = '✦ ' + star.data.nom + ' ✦';
    document.getElementById('starMsg').textContent = star.data.msg;
    msgWrap.classList.add('show');
    msgWrap.style.pointerEvents = 'auto';
  }

  function hideMessage() {
    msgWrap.classList.remove('show');
    msgWrap.style.pointerEvents = 'none';
  }

  document.getElementById('closeX').addEventListener('click', hideMessage);
  document.getElementById('closeBtn').addEventListener('click', hideMessage);
  msgWrap.addEventListener('click', function (e) { if (e.target === msgWrap) hideMessage(); });
  document.getElementById('revBtn').addEventListener('click', showConstellation);

  canvas.addEventListener('pointerdown', function (e) {
    var star = nearestSpecial(e.clientX, e.clientY);
    if (star) {
      sparkle(star.x, star.y);
      showMessage(star);
    } else {
      sparkle(e.clientX, e.clientY);
    }
  });

  // ---------- BUCLE ----------
  function loop(time) {
    draw(time);
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('load', function () {
    resize();
    requestAnimationFrame(loop);
  });
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
